:root {

  --bg-sub: #f2f4f6;
  --text: #191f28;
  --text2: #4e5968;
  --text3: #8b95a1;
  --line: #e5e8eb;
  --blue: #3182f6;
  --blue-deep: #1b64da;
  --blue-soft: #e8f3ff;

  --down: #3182f6;
  --warn: #e67700;
  --warn-soft: #fff4e5;
  --radius: 16px;
  --gutter: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-sub); color: var(--text);
  font-family: "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  line-height: 1.55; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 600px; min-height: 100vh; margin: 0 auto; background: var(--bg); }
.block { padding: 24px var(--gutter-r) 24px var(--gutter); min-width: 0; }
.block + .block { border-top: 8px solid var(--bg-sub); }
.block-title { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
.block-sub { font-size: 0.85rem; color: var(--text3); margin-bottom: 16px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px var(--gutter-r) 6px var(--gutter); }
.brand { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; color: var(--blue); }
.pill { font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--bg-sub); color: var(--text2); white-space: nowrap; }
.pill.blue { background: var(--blue-soft); color: var(--blue-deep); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 8px var(--gutter-r) 14px var(--gutter); scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.company-chip { flex: 0 0 auto; border: none; background: var(--bg-sub); color: var(--text2); border-radius: 999px; padding: 8px 14px; font-size: 0.88rem; font-weight: 600; display: inline-flex; align-items: baseline; gap: 6px; }
.company-chip small { font-size: 0.68rem; font-weight: 600; color: var(--text3); }
.company-chip.on { background: var(--text); color: #fff; }
.company-chip.on small { color: #b0b8c1; }

.hero { padding: 12px var(--gutter-r) 28px var(--gutter); }
.hero-meta { font-size: 0.85rem; color: var(--text3); font-weight: 500; }
.hero-label { margin-top: 18px; font-size: 0.95rem; color: var(--text2); font-weight: 500; }
.hero-value { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-top: 2px; }
.hero-delta { margin-top: 6px; font-size: 0.95rem; font-weight: 600; }
.hero-delta .base { color: var(--text3); font-weight: 400; margin-right: 6px; }
.up { color: var(--up); }
.down { color: var(--down); }
.hero-about { margin-top: 14px; font-size: 0.85rem; color: var(--text3); }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; gap: 4px; background: var(--bg); padding: 0 var(--gutter-r) 0 var(--gutter); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; background: none; border: none; padding: 14px 8px; font-size: 0.95rem; font-weight: 600; color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--text); border-bottom-color: var(--text); }

.metric-list { display: flex; flex-direction: column; }
.metric { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--bg-sub); }
.metric:last-child { border-bottom: none; }
.metric-left { min-width: 0; }
.metric-name { font-size: 0.95rem; font-weight: 600; }
.metric-easy { font-size: 0.8rem; color: var(--text3); margin-top: 2px; }
.metric-right { text-align: right; flex: 0 0 auto; }
.metric-value { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.metric-delta { font-size: 0.78rem; font-weight: 600; margin-top: 1px; }

.analysis-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.analysis-head .block-title { margin: 0; }
.headline { font-size: 1.3rem; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; text-wrap: balance; }
.notice { margin-top: 12px; font-size: 0.78rem; color: var(--text3); background: var(--bg-sub); padding: 8px 12px; border-radius: 10px; }
.bullets { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 10px; }
.bullets li { position: relative; padding-left: 16px; font-size: 0.92rem; color: var(--text2); }
.bullets li::before { content: ""; position: absolute; left: 2px; top: 0.65em; width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
.pros-cons { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }

.pc h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
.pc.pro h3 { color: var(--blue-deep); }
.pc.con h3 { color: var(--warn); }
.pc ul { margin: 0; padding-left: 16px; font-size: 0.86rem; color: var(--text2); display: flex; flex-direction: column; gap: 6px; }
.tip { margin-top: 16px; background: var(--blue-soft); color: var(--blue-deep); border-radius: var(--radius); padding: 14px 16px; font-size: 0.88rem; }
.tip strong { display: block; margin-bottom: 2px; }
.disclaimer { margin-top: 14px; font-size: 0.74rem; color: var(--text3); }

.seg { display: flex; background: var(--bg-sub); border-radius: 12px; padding: 4px; gap: 4px; margin: 12px 0 16px; }
.seg button { flex: 1; border: none; background: none; padding: 8px 4px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; color: var(--text3); }

.chart-box { position: relative; width: 100%; height: 280px; }

.table-wrap { overflow-x: auto; margin: 0 calc(var(--gutter-r) * -1) 0 calc(var(--gutter) * -1); }
table { border-collapse: collapse; width: 100%; font-size: 0.82rem; min-width: 640px; }
th, td { padding: 11px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--bg-sub); font-variant-numeric: tabular-nums; }
thead th { color: var(--text3); font-weight: 600; background: var(--bg); }
th.sticky { position: sticky; left: 0; text-align: left; background: var(--bg); font-weight: 500; padding-left: var(--gutter); z-index: 1; }
.section-row td { text-align: left; font-weight: 700; font-size: 0.8rem; background: var(--bg-sub); color: var(--text2); padding-left: var(--gutter); }
td.neg { color: var(--down); }

.gloss { border-bottom: 1px solid var(--bg-sub); }
.gloss summary { list-style: none; cursor: pointer; padding: 16px 0; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.95rem; }
.gloss summary::-webkit-details-marker { display: none; }
.gloss summary::after { content: "+"; color: var(--text3); font-size: 1.2rem; font-weight: 400; }
.gloss[open] summary::after { content: "−"; }
.gloss-body { padding: 0 0 16px; display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; color: var(--text2); }
.formula { background: var(--blue-soft); color: var(--blue-deep); border-radius: 10px; padding: 8px 12px; font-size: 0.82rem; font-weight: 600; }
.example { font-size: 0.82rem; color: var(--text3); }
.empty { padding: 24px 0; color: var(--text3); font-size: 0.9rem; }

.sheet .close { margin-top: 8px; border: none; background: var(--blue); color: #fff; font-weight: 700; font-size: 1rem; padding: 14px; border-radius: 14px; }

.foot { padding: 24px var(--gutter-r) 40px var(--gutter); font-size: 0.75rem; color: var(--text3); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

};

/* =====================================================================
   계산 도우미
   ===================================================================== */
function enrich(quarters) {
  return quarters.map(function (d) {
    var equity = d.assets - d.liab;
    return Object.assign({}, d, {
      equity: equity,
      opMargin: (d.op / d.revenue) * 100,
      netMargin: (d.net / d.revenue) * 100,
      debtRatio: equity > 0 ? (d.liab / equity) * 100 : null,
      netDebt: d.debt - d.cash,
      fcf: d.ocf - d.capex
    });
  });
}
// 4분기 전(작년 같은 분기)과 비교한 증감률(%)
function yoy(rows, i, key) {
  if (i < 4) return null;
  var prev = rows[i - 4][key];
  if (!prev) return null;
  return ((rows[i][key] - prev) / Math.abs(prev)) * 100;
}
function qoq(rows, i, key) {
  if (i < 1) return null;
  var prev = rows[i - 1][key];
  if (!prev) return null;
  return ((rows[i][key] - prev) / Math.abs(prev)) * 100;
}
// 금액 표시: 미국은 $M → $B, 한국은 억원 → 조원
function fmtAmount(v, c) {
  if (v == null || isNaN(v)) return "-";
  var sign = v < 0 ? "-" : "", a = Math.abs(v);
  if (c.market === "US") return a >= 1000 ? sign + "$" + (a / 1000).toFixed(1) + "B" : sign + "$" + Math.round(a).toLocaleString() + "M";
  return a >= 10000 ? sign + (a / 10000).toFixed(1) + "조원" : sign + Math.round(a).toLocaleString() + "억원";
}
function fmtNum(v) { return v == null || isNaN(v) ? "-" : Math.round(v).toLocaleString(); }
function fmtPct(v, d) { return v == null || isNaN(v) ? "-" : v.toFixed(d == null ? 1 : d) + "%"; }
function fmtDelta(v) {
  if (v == null || isNaN(v)) return null;
  return (v > 0 ? "▲ " : v < 0 ? "▼ " : "– ") + Math.abs(v).toFixed(1) + "%";
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtDate(iso) {
  var d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return "";
  return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
}

// 지표별 "쉬운 한 줄 해석"
function easyReading(key, r) {
  if (key === "opMargin") return r.opMargin < 0 ? "100원 팔았는데 " + Math.abs(r.opMargin).toFixed(1) + "원 손해를 봤어요" : "100원 팔면 본업에서 " + r.opMargin.toFixed(1) + "원이 남아요";
  if (key === "debtRatio") {
    if (r.debtRatio == null) return "자본이 없거나 마이너스 상태예요";
    var level = r.debtRatio < 100 ? "안정적인 편" : r.debtRatio < 200 ? "보통 수준" : "높은 편이라 주의";
    return "내 돈 100원당 빚이 " + Math.round(r.debtRatio) + "원 · " + level;
  }
  if (key === "fcf") return r.fcf >= 0 ? "투자비를 쓰고도 자유롭게 쓸 현금이 남았어요" : "투자비가 벌어온 현금보다 커서 현금이 모자라요";
  return "";
}

/* =====================================================================
   자동 요약 (규칙 기반): 실제 회사에는 아직 AI 분석이 없어서 숫자만 보고 만들어요.
   ===================================================================== */
function ruleBased(company) {
  var rows = enrich(company.quarters), i = rows.length - 1, last = rows[i];
  var revYoy = yoy(rows, i, "revenue"), opYoy = yoy(rows, i, "op");
  var marginDiff = i >= 4 ? last.opMargin - rows[i - 4].opMargin : null;
  var pct = function (v) { return Math.abs(v).toFixed(1) + "%"; };
  var summary = [], good = [], concern = [];

  if (revYoy != null) {
    if (revYoy >= 10) { summary.push("매출이 1년 전보다 " + pct(revYoy) + " 늘었어요."); good.push("매출이 빠르게 성장"); }
    else if (revYoy >= 0) summary.push("매출이 1년 전보다 " + pct(revYoy) + " 조금 늘었어요.");
    else { summary.push("매출이 1년 전보다 " + pct(revYoy) + " 줄었어요."); concern.push("매출 감소"); }
  }
  if (last.op < 0) { summary.push("본업에서 " + pct(last.opMargin) + "만큼 손실이 났어요 (영업적자)."); concern.push("영업적자"); }
  else if (marginDiff != null) {
    var dir = marginDiff >= 0.5 ? "올랐어요" : marginDiff <= -0.5 ? "내려갔어요" : "비슷해요";
    summary.push("100원 팔면 " + last.opMargin.toFixed(1) + "원이 남아요. 1년 전보다 " + dir + ".");
    if (marginDiff >= 0.5) good.push("영업이익률 개선");
    if (marginDiff <= -0.5) concern.push("영업이익률 하락");
  } else summary.push("100원 팔면 본업에서 " + last.opMargin.toFixed(1) + "원이 남아요.");
  if (opYoy != null && last.op >= 0 && i >= 4 && rows[i - 4].op > 0 && opYoy >= 20) good.push("영업이익이 크게 증가");

  if (last.fcf >= 0) { summary.push("투자비를 쓰고도 자유롭게 쓸 현금이 남았어요."); good.push("잉여현금흐름 플러스"); }
  else { summary.push("투자비가 벌어온 현금보다 커서 현금이 모자라요."); concern.push("잉여현금흐름 마이너스"); }

  if (last.netDebt < 0) good.push("빚보다 현금이 많은 상태");
  if (last.debtRatio != null && last.debtRatio >= 200) concern.push("부채비율 200% 이상");
  if (last.debtRatio != null && last.debtRatio < 100) good.push("부채비율이 낮아 안정적");
  var q = qoq(rows, i, "revenue");
  if (i >= 1 && q != null && Math.abs(q) >= 15) concern.push("직전 분기와 매출 차이가 커요 (계절성이나 업황 영향일 수 있어요)");

  var headline;
  if (last.op < 0) headline = "이번 분기는 본업에서 손실이 났어요";
  else if (revYoy != null && revYoy >= 10 && (marginDiff == null ? 0 : marginDiff) >= -0.5) headline = "매출이 늘고 수익성도 유지되고 있어요";
  else if (revYoy != null && revYoy < 0) headline = "매출이 1년 전보다 줄었어요";
  else headline = "큰 변화 없이 안정적인 흐름이에요";

  var hasRisk = concern.length > 0;
  if (!good.length) good.push("눈에 띄는 강점은 아직 보이지 않아요");
  if (!concern.length) concern.push("숫자상 특별한 위험 신호는 없어요");
  return {
    quarter: last.q, verdict: concern.length >= 2 && hasRisk ? "caution" : "good", headline: headline,
    summary: summary, good: good, concern: concern,
    beginnerTip: "이 요약은 숫자만 보고 정해진 규칙으로 만든 거예요. 업종 특성과 최근 뉴스까지 함께 봐야 정확해요. 계절을 타는 회사는 직전 분기보다 작년 같은 분기와 비교하세요.",
    isAuto: true
  };
}

// 분석 가져오기: 서버리스 함수(AI) → 샘플 분석 → 자동 요약 순서
var analysisCache = {};
function getAnalysis(c) {
  if (ANALYSIS_ENDPOINT) {
    if (analysisCache[c.id]) return analysisCache[c.id];
    analysisCache[c.id] = { loading: true };
    fetch(ANALYSIS_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ company: c.id, quarters: c.quarters }) })
      .then(function (r) { if (!r.ok) throw new Error("분석 요청 실패 (" + r.status + ")"); return r.json(); })
      .then(function (j) { analysisCache[c.id] = j; })
      .catch(function (e) { analysisCache[c.id] = { error: e.message }; })
      .then(function () { if (state.company && state.company.id === c.id) render(); });
    return analysisCache[c.id];
  }
  if (SAMPLE_ANALYSIS[c.id]) return Object.assign({ isSample: true }, SAMPLE_ANALYSIS[c.id]);
  return ruleBased(c);
}

    '<p class="hero-about">' + esc(c.about) + "</p></section>";
}
function renderTabs() {
  var tabs = [["summary", "요약"], ["chart", "차트"], ["statements", "재무제표"], ["glossary", "용어"]];
  return '<div class="tabs" role="tablist">' + tabs.map(function (t) {
    return '<button class="tab' + (state.tab === t[0] ? " on" : "") + '" role="tab" aria-selected="' + (state.tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
  }).join("") + "</div>";
}

function renderKpi() {
  var c = state.company, rows = state.rows, i = rows.length - 1, last = rows[i];
  var opYoy = yoy(rows, i, "op");
  var items = [
    { id: "opMargin", value: fmtPct(last.opMargin), delta: fmtDelta(opYoy), up: opYoy > 0, easy: easyReading("opMargin", last) },
    { id: "debtRatio", value: last.debtRatio == null ? "-" : Math.round(last.debtRatio) + "%", easy: easyReading("debtRatio", last) },
    { id: "fcf", value: fmtAmount(last.fcf, c), easy: easyReading("fcf", last) },
    { id: "net", value: fmtAmount(last.net, c), easy: "세금과 이자까지 낸 뒤 최종으로 남은 돈이에요" }
  ];
  return '<section class="block" aria-label="핵심 지표"><h2 class="block-title">' + esc(last.q) + ' 핵심 지표</h2><p class="block-sub">용어를 누르면 쉬운 설명이 나와요</p><div class="metric-list">' +
    items.map(function (m) {
      return '<div class="metric"><div class="metric-left"><div class="metric-name">' + term(m.id) + '</div><div class="metric-easy">' + esc(m.easy) + "</div></div>" +
        '<div class="metric-right"><div class="metric-value num">' + esc(m.value) + "</div>" +
        (m.delta ? '<div class="metric-delta num ' + (m.up ? "up" : "down") + '">' + m.delta + "</div>" : "") + "</div></div>";
    }).join("") + "</div></section>";
}

function renderAnalysis() {
  var a = getAnalysis(state.company);
  if (a.loading) return '<section class="block"><p class="block-sub">분석 불러오는 중…</p></section>';
  if (a.error) return '<section class="block"><p class="block-sub">분석을 불러오지 못했어요: ' + esc(a.error) + "</p></section>";
  var v = { good: ["전반적으로 양호", "blue"], caution: ["주의해서 볼 점 있음", "warn"], bad: ["부진", "warn"] }[a.verdict] || ["전반적으로 양호", "blue"];
  var li = function (arr) { return arr.map(function (s) { return "<li>" + esc(s) + "</li>"; }).join(""); };
  return '<section class="block" aria-label="실적 분석"><div class="analysis-head"><h2 class="block-title">' + esc(a.quarter) + ' 실적 분석</h2><span class="pill ' + v[1] + '">' + v[0] + "</span></div>" +
    '<p class="headline">' + esc(a.headline) + "</p>" +
    (a.isSample ? '<p class="notice">샘플 분석(목업)이에요. 이후 단계에서 AI 분석이 자동으로 생성돼요.</p>' : "") +
    (a.isAuto ? '<p class="notice">숫자만 보고 규칙으로 만든 자동 요약이에요. AI 분석은 다음 단계에서 붙여요.</p>' : "") +
    '<ul class="bullets">' + li(a.summary) + "</ul>" +
    '<div class="pros-cons"><div class="pc pro"><h3>좋았던 점</h3><ul>' + li(a.good) + '</ul></div><div class="pc con"><h3>걱정되는 점</h3><ul>' + li(a.concern) + "</ul></div></div>" +
    '<div class="tip"><strong>입문자 팁</strong>' + esc(a.beginnerTip) + "</div>" +
    '<p class="disclaimer">투자 권유가 아닌 학습용 해설이에요. 투자 판단과 책임은 본인에게 있어요.</p></section>';
}

var CHART_TABS = [["profit", "매출·이익"], ["cash", "현금 흐름"], ["safety", "재무 안정성"]];
function renderChartTab() {
  var help = {
    profit: "연한 파랑 막대(" + term("revenue") + ")가 커질 때 진한 파랑 막대(" + term("op") + ")도 같이 커지면 좋은 신호예요. 검은 선은 " + term("opMargin") + "로, 100원 팔 때 남는 돈이에요.",
    cash: "파랑(" + term("ocf") + ")이 회색(" + term("capex") + ")보다 높으면 " + term("fcf") + "(검은 선)가 플러스예요. 낮으면 모자란 돈을 빌리거나 모아둔 현금으로 메워야 해요.",
    safety: "파란 선(현금)이 점선(차입금)보다 위에 있으면 " + term("netDebt") + "가 마이너스예요. 빚보다 현금이 많은 든든한 상태예요."
  }[state.chartTab];
  return '<section class="block" aria-label="차트"><h2 class="block-title">최근 ' + state.rows.length + '분기 추이</h2><div class="seg" role="tablist">' +
    CHART_TABS.map(function (t) {
      return '<button role="tab" class="' + (state.chartTab === t[0] ? "on" : "") + '" aria-selected="' + (state.chartTab === t[0]) + '" data-chart="' + t[0] + '">' + t[1] + "</button>";
    }).join("") + '</div><div class="chart-box"><canvas id="chart" role="img" aria-label="분기별 추이 차트"></canvas></div><p class="chart-help">' + help + "</p></section>";
}

function drawChart() {
  if (chart) { chart.destroy(); chart = null; }
  var canvas = $("#chart");
  if (!canvas) return;
  if (typeof Chart === "undefined") {
    canvas.parentElement.innerHTML = '<p class="empty">차트를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>';
    return;
  }
  var c = state.company, rows = state.rows;
  var money = function (v) { return fmtAmount(v, c); };
  var COL = { blue: "#3182f6", blueLight: "#b9d8ff", gray: "#b0b8c1", dark: "#191f28", mid: "#4e5968" };
  var bar = function (label, key, color) { return { type: "bar", label: label, data: rows.map(function (r) { return r[key]; }), backgroundColor: color, borderRadius: 4, yAxisID: "y", order: 2 }; };
  var line = function (label, key, color, o) {
    return Object.assign({ type: "line", label: label, data: rows.map(function (r) { return r[key]; }), borderColor: color, backgroundColor: color, borderWidth: 2.5, pointRadius: 3, tension: 0, yAxisID: "y", order: 1 }, o || {});
  };
  var datasets, rightAxis = false;
  if (state.chartTab === "profit") {
    datasets = [bar("매출액", "revenue", COL.blueLight), bar("영업이익", "op", COL.blue), line("영업이익률", "opMargin", COL.dark, { yAxisID: "y1", borderWidth: 2 })];
    rightAxis = true;
  } else if (state.chartTab === "cash") {
    datasets = [bar("영업현금흐름", "ocf", COL.blue), bar("설비투자", "capex", COL.gray), line("잉여현금흐름", "fcf", COL.dark, { borderWidth: 2 })];
  } else {
    datasets = [line("현금", "cash", COL.blue), line("차입금", "debt", COL.mid, { borderDash: [5, 4] })];
  }
  var tick = { color: "#8b95a1", font: { size: 11 }, maxRotation: 0 };
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  chart = new Chart(canvas, {
    type: "bar",
    data: { labels: rows.map(function (r) { return r.q.replace(/^20/, ""); }), datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { position: "bottom", labels: { usePointStyle: true, boxWidth: 8, font: { size: 12 }, color: "#4e5968", sort: function (a, b) { return a.datasetIndex - b.datasetIndex; } } },
        tooltip: { callbacks: { label: function (ctx) { return ctx.dataset.label + ": " + (ctx.dataset.yAxisID === "y1" ? ctx.parsed.y.toFixed(1) + "%" : money(ctx.parsed.y)); } } }
      },
      scales: {
        x: { grid: { display: false }, ticks: tick, border: { display: false } },
        y: { grid: { color: "#f2f4f6" }, border: { display: false }, ticks: Object.assign({ callback: money }, tick) },
        y1: { display: rightAxis, position: "right", grid: { drawOnChartArea: false }, border: { display: false }, ticks: Object.assign({ callback: function (v) { return v + "%"; } }, tick) }
      }
    }
  });
}

var SECTIONS = [
  { title: "손익계산서 · 얼마나 벌었나", rows: [["revenue", "revenue"], ["op", "op"], ["net", "net"], ["opMargin", "opMargin", 1], ["netMargin", "netMargin", 1]] },
  { title: "재무상태표 · 가진 것과 갚을 것", rows: [["assets", "assets"], ["liab", "liab"], ["equity", "equity"], ["debtRatio", "debtRatio", 0], [null, "cash", null, "현금"], [null, "debt", null, "차입금"], ["netDebt", "netDebt"]] },
  { title: "현금흐름표 · 실제 들어온 현금", rows: [["ocf", "ocf"], ["capex", "capex"], ["fcf", "fcf"]] }
];
function renderStatements() {
  var rows = state.rows, pctKeys = { opMargin: 1, netMargin: 1, debtRatio: 1 };
  var head = "<tr><th class=\"sticky\">항목</th>" + rows.map(function (r) { return "<th>" + esc(r.q) + "</th>"; }).join("") + "</tr>";
  var body = SECTIONS.map(function (s) {
    return '<tbody><tr class="section-row"><td colspan="' + (rows.length + 1) + '">' + esc(s.title) + "</td></tr>" + s.rows.map(function (row) {
      var id = row[0], key = row[1], digits = row[2], label = row[3];
      return '<tr><th class="sticky" scope="row">' + (id ? term(id) : esc(label)) + "</th>" + rows.map(function (r) {
        var v = r[key];
        return '<td class="' + (typeof v === "number" && v < 0 ? "neg" : "") + '">' + (pctKeys[key] ? fmtPct(v, digits == null ? 1 : digits) : fmtNum(v)) + "</td>";
      }).join("") + "</tr>";
    }).join("") + "</tbody>";
  }).join("");
  return '<section class="block" aria-label="재무제표 표"><h2 class="block-title">재무제표 한눈에</h2><p class="block-sub">단위: ' + esc(state.company.unitLabel) +
    ' · 옆으로 밀어서 볼 수 있어요</p><div class="table-wrap"><table><thead>' + head + "</thead>" + body + "</table></div></section>";
}

function glossItems(q) {
  q = (q || "").trim().toLowerCase();
  var items = Object.keys(GLOSSARY).filter(function (id) { var g = GLOSSARY[id]; return (g.term + g.easy).toLowerCase().indexOf(q) !== -1; });
  if (!items.length) return '<p class="empty">검색 결과가 없어요.</p>';
  return items.map(function (id) {
    var g = GLOSSARY[id];
    return '<details class="gloss"><summary>' + esc(g.term) + '</summary><div class="gloss-body"><p>' + esc(g.easy) + "</p>" +
      (g.formula ? '<div class="formula">계산: ' + esc(g.formula) + "</div>" : "") + (g.example ? '<p class="example">예) ' + esc(g.example) + "</p>" : "") + "</div></details>";
  }).join("");
}
function renderGlossary() {
  return '<section class="block" aria-label="용어 사전"><h2 class="block-title">용어 사전</h2><p class="block-sub">입문자 기준으로 풀어 썼어요</p>' +
    '<input id="gloss-q" class="search" type="search" placeholder="용어 검색 (예: 부채, 현금)"><div id="gloss-list">' + glossItems("") + "</div></section>";
}

function render() {
  if (!state.company) return;
  var live = state.data.source === "live";
  var main = "";
  if (state.tab === "summary") main = renderKpi() + renderAnalysis();
  else if (state.tab === "chart") main = renderChartTab();
  else if (state.tab === "statements") main = renderStatements();
  else main = renderGlossary();
  $("#app").innerHTML = renderTop() + renderChips() + renderHero() + renderTabs() + main +
    '<footer class="foot">학습용 서비스이며 투자 권유가 아니에요. ' +
    (live ? "숫자는 SEC·DART 공시를 바탕으로 가져오며, 차입금 등 일부 항목은 대략적인 합계예요. 정확한 값은 공시 원문을 확인하세요." : "표시되는 숫자는 모두 샘플입니다.") +
    "<br>한국 증시 관례에 맞춰 상승은 빨강, 하락은 파랑으로 표시해요.</footer>";
  if (state.tab === "chart") drawChart(); else if (chart) { chart.destroy(); chart = null; }
}

function selectCompany(id) {
  var c = state.data.companies.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  state.company = c;
  state.rows = enrich(c.quarters);
}

/* =====================================================================
   용어 바텀시트
   ===================================================================== */
function openSheet(id) {
  var g = GLOSSARY[id];
  if (!g) return;
  closeSheet();
  var back = document.createElement("div");
  back.className = "sheet-back";
  back.id = "sheet";
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(g.term) + '"><h3>' + esc(g.term) + "</h3><p>" + esc(g.easy) + "</p>" +
    (g.formula ? '<div class="formula">계산: ' + esc(g.formula) + "</div>" : "") + (g.example ? '<p class="example">예) ' + esc(g.example) + "</p>" : "") +
    '<button type="button" class="close">확인</button></div>';
  document.body.appendChild(back);
  back.querySelector(".close").focus();
}
function closeSheet() { var s = $("#sheet"); if (s) s.remove(); }

/* =====================================================================
   이벤트 (화면을 다시 그려도 계속 동작하도록 문서 전체에서 한 번만 등록)
   ===================================================================== */
document.addEventListener("click", function (e) {
  var t = e.target;
  if (t.closest && t.closest(".sheet-back")) {
    if (t.classList.contains("sheet-back") || t.classList.contains("close")) closeSheet();
    return;
  }
  var el;
  if ((el = t.closest("[data-term]"))) return openSheet(el.getAttribute("data-term"));
  if ((el = t.closest("[data-company]"))) { selectCompany(el.getAttribute("data-company")); return render(); }
  if ((el = t.closest("[data-tab]"))) { state.tab = el.getAttribute("data-tab"); return render(); }
  if ((el = t.closest("[data-chart]"))) { state.chartTab = el.getAttribute("data-chart"); return render(); }
});
document.addEventListener("input", function (e) {
  if (e.target && e.target.id === "gloss-q") $("#gloss-list").innerHTML = glossItems(e.target.value);
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

/* =====================================================================
   시작: 실제 데이터 파일이 있으면 쓰고, 없으면(또는 파일을 더블클릭으로 연 경우) 샘플을 써요
   ===================================================================== */
function loadData() {
  return fetch(DATA_URL, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function (j) {
      if (!j || !Array.isArray(j.companies) || !j.companies.length) throw new Error("empty");
      return { companies: j.companies, source: "live", updatedAt: j.updatedAt };
    })
    .catch(function () { return { companies: SAMPLE, source: "sample", updatedAt: null }; });
}
loadData().then(function (d) {
  state.data = d;
  selectCompany(d.companies[0].id);
  render();
});
})();
</script>
</body>
</html>
